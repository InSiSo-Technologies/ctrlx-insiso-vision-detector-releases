# Copy a published release from the private build repository to this public one.
#
# Why this exists at all: the snaps are built and released in
# InSiSo-Technologies/ctrlx-insiso-vision-detector, which is private, so its
# release assets 404 for anyone without access. This repository is the public
# face of those same files, and the copy has to happen somewhere with
# bandwidth to spare -- a GitHub runner, rather than a laptop on a slow link,
# which is the entire point.
#
# Manual rather than automatic. A release becoming public is a decision, and
# it should not be a side effect of tagging a build.
name: Mirror a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to copy, e.g. v5.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the public release as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write          # to create the release here and upload its assets

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (for the release notes template)
        uses: actions/checkout@v4

      # A fine-grained PAT with read access to the private repository's
      # Contents. GITHUB_TOKEN cannot be used: it is scoped to THIS
      # repository, and the assets live in another one.
      - name: Fetch the release and its assets
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE: InSiSo-Technologies/ctrlx-insiso-vision-detector
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Fail loudly if the secret is missing or cannot see the source --
          # an empty download that then publishes an assetless release is the
          # worst outcome, because it looks like it worked.
          gh release view "$TAG" --repo "$SOURCE" --json tagName,body \
            > source.json
          gh release download "$TAG" --repo "$SOURCE" --dir dist --pattern '*.snap'
          ls -l dist
          test -n "$(ls -A dist)" || { echo "No .snap assets on $TAG"; exit 1; }

      - name: Record the checksums
        run: |
          cd dist
          sha256sum *.snap | tee ../SHA256SUMS
          # Published beside the assets so a download over a bad link can be
          # verified rather than hoped about.

      - name: Publish here
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES=$(python3 - <<'PY'
          import json, os
          src = json.load(open('source.json'))
          sums = open('SHA256SUMS').read().strip()
          # Only the assets this release has: GitHub takes files up to
          # 2 GiB, and the amd64 snap (NVIDIA runtime, over 3 GB) is larger.
          devices = {
              'amd64': 'ctrlX CORE **X5**, **X7**, a ctrlX **IPC**, ctrlX OS in a VM',
              'arm64': 'ctrlX CORE **X3**',
          }
          assets = sorted(os.listdir('dist'))
          rows = "\n".join(f"| `{a}` | {devices.get(a.rsplit('_', 1)[-1].removesuffix('.snap'), '')} |"
                           for a in assets)
          missing = "" if any(a.endswith('_amd64.snap') for a in assets) else (
              "The amd64 snap (ctrlX CORE X5, X7, IPC) is larger than GitHub's "
              "2 GiB limit for one file and is not attached. Ask "
              "srishti@insisotech.com for a download link.\n\n")
          print(f"""Snap builds of the InSiSo Visual Detector for ctrlX OS.

          The first number of the version is the ctrlX OS major (4 = ctrlX OS 4.x).
          Every build up to 7.2.17 is older than 4.7.18.

          | Asset | Device |
          |---|---|
          {rows}

          {missing}Install from the ctrlX web interface in Service mode (Settings -> Apps ->
          Install from file), or `snap install --dangerous ./<file>.snap`. After an
          update, reboot the device once.

          ### SHA-256

          ```
          {sums}
          ```

          ---

          {src.get('body') or ''}""")
          PY
          )
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" dist/*.snap SHA256SUMS \
            --title "$TAG" --notes "$NOTES" $FLAGS
